<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Certidões</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 32px; color: #1b1b1b; background: #fff; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input { font: inherit; padding: 8px; width: 100%; box-sizing: border-box; }
  button { font: inherit; padding: 8px 16px; margin-top: 12px; cursor: pointer; }
  #status { margin-top: 20px; min-height: 24px; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid #ddd; }
  td.detalhe { overflow-wrap: anywhere; font-size: 14px; }
  td.detalhe button { margin-top: 6px; padding: 4px 12px; }
  .erro { color: #b00020; }
  .Obtida { color: #1b6e1b; font-weight: 600; }
  .alerta { color: #8a4b00; font-weight: 600; }
  .aviso { margin-top: 24px; padding: 10px 12px; background: #f3f3f3; border-left: 4px solid #777; font-size: 14px; }
  .nao-emitida { margin-top: 10px; }
  .nao-emitida label { font-weight: 400; font-size: 13px; margin-bottom: 4px; }
  .nao-emitida textarea { font: inherit; font-size: 14px; width: 100%; box-sizing: border-box; padding: 6px; }
  .nao-emitida button { margin-top: 6px; }
  .empresa { margin-top: 20px; padding: 12px 16px; border: 1px solid #ccc; border-radius: 4px; }
  .empresa dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
  .empresa dt { font-weight: 600; }
  .empresa dd { margin: 0; }
  #escolhas button { margin-right: 8px; }
  [hidden] { display: none; }
</style>
</head>
<body>
  <h1>Certidões do fornecedor</h1>
  <form id="formulario">
    <label for="cnpj">CNPJ da empresa</label>
    <input id="cnpj" autocomplete="off" autofocus>
    <button id="identificar" type="submit">Identificar empresa</button>
  </form>
  <section id="empresa" class="empresa" hidden>
    <div id="dados-empresa"></div>
    <p id="aviso-empresa"></p>
    <div id="escolhas"></div>
  </section>
  <p id="status" role="status"></p>
  <p id="aviso-filial" class="alerta" hidden></p>
  <table id="itens" hidden>
    <thead><tr><th>Certidão</th><th>Portal</th><th>Estado</th><th>Situação</th><th>Validade</th><th>Detalhes</th></tr></thead>
    <tbody></tbody>
  </table>
  <p id="aviso" class="aviso">Este programa só reúne informações dos portais. A análise dos documentos e a decisão cabem ao servidor. Sempre confira o PDF.</p>
<script>
  const status = document.getElementById('status');
  const identificar = document.getElementById('identificar');
  const cartao = document.getElementById('empresa');
  const dadosEmpresa = document.getElementById('dados-empresa');
  const avisoEmpresa = document.getElementById('aviso-empresa');
  const escolhas = document.getElementById('escolhas');
  const avisoFilial = document.getElementById('aviso-filial');
  const tabela = document.getElementById('itens');
  const corpo = tabela.querySelector('tbody');
  const linhas = new Map();

  function mostrar(texto, erro) {
    status.textContent = texto;
    status.className = erro ? 'erro' : '';
  }

  function celula(linha, classe) {
    const td = document.createElement('td');
    if (classe) td.className = classe;
    linha.appendChild(td);
    return td;
  }

  function criarLinha(item) {
    const tr = document.createElement('tr');
    celula(tr).textContent = item.nome;
    celula(tr).textContent = item.portal;
    const estado = celula(tr);
    const situacao = celula(tr);
    const validade = celula(tr);
    const detalhe = celula(tr, 'detalhe');
    const mensagem = document.createElement('div');
    const abrir = document.createElement('button');
    abrir.type = 'button';
    abrir.textContent = 'Abrir PDF';
    abrir.hidden = true;
    abrir.addEventListener('click', () => window.pywebview.api.abrir_pdf(item.chave));

    const naoEmitida = document.createElement('div');
    naoEmitida.className = 'nao-emitida';
    naoEmitida.hidden = true;
    const rotulo = document.createElement('label');
    rotulo.textContent = 'Mensagem do portal (opcional)';
    rotulo.htmlFor = 'msg-' + item.chave;
    const campo = document.createElement('textarea');
    campo.id = 'msg-' + item.chave;
    campo.rows = 2;
    campo.maxLength = 1000;
    const informar = document.createElement('button');
    informar.type = 'button';
    informar.textContent = 'O portal não emitiu';
    informar.addEventListener('click', async () => {
      informar.disabled = true;
      const ok = await window.pywebview.api.informar_nao_emitida(item.chave, campo.value);
      if (!ok) informar.disabled = false;
    });
    naoEmitida.append(rotulo, campo, informar);

    detalhe.append(mensagem, abrir, naoEmitida);
    corpo.appendChild(tr);
    return { estado, situacao, validade, mensagem, abrir, naoEmitida, informar };
  }

  function desenhar(itens) {
    for (const item of itens) {
      if (!linhas.has(item.chave)) linhas.set(item.chave, criarLinha(item));
      const l = linhas.get(item.chave);
      l.estado.textContent = item.estado;
      l.estado.className = {'Obtida': 'Obtida', 'Falha técnica': 'erro', 'Não emitida': 'alerta'}[item.estado] || '';
      l.situacao.textContent = item.situacao || '';
      l.situacao.className = item.situacao === 'Conferir no PDF' ? 'alerta' : '';
      l.validade.textContent = item.validade ? item.validade + (item.vencida ? ' (Vencida)' : '') : '';
      l.validade.className = item.vencida ? 'erro' : (item.validade === 'Conferir no PDF' ? 'alerta' : '');
      l.mensagem.textContent = item.arquivo ? 'Salva em: ' + item.arquivo : item.mensagem;
      l.abrir.hidden = !item.arquivo;
      l.naoEmitida.hidden = !(item.modo === 'navegador' && item.estado === 'Aguardando servidor');
    }
    tabela.hidden = itens.length === 0;
  }

  function travar(sim) {
    identificar.disabled = sim;
    for (const b of escolhas.querySelectorAll('button')) b.disabled = sim || b.dataset.bloqueado === 'sim';
  }

  async function acompanhar() {
    try {
      const r = await window.pywebview.api.estado();
      desenhar(r.itens);
      if (r.rodando) {
        setTimeout(acompanhar, 700);
        return;
      }
      mostrar('Consulta concluída.');
    } catch (erro) {
      mostrar('Erro inesperado: ' + erro, true);
    }
    travar(false);
  }

  function linhaDado(dl, rotulo, valor, classe) {
    const dt = document.createElement('dt');
    dt.textContent = rotulo;
    const dd = document.createElement('dd');
    dd.textContent = valor;
    if (classe) dd.className = classe;
    dl.append(dt, dd);
  }

  function botaoEscolha(rotulo, emp) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = rotulo;
    if (!emp.atendida) b.dataset.bloqueado = 'sim';
    b.disabled = !emp.atendida;
    b.addEventListener('click', () => iniciar(emp.cnpj));
    escolhas.appendChild(b);
  }

  function mostrarEmpresa(r) {
    const e = r.empresa;
    const dl = document.createElement('dl');
    linhaDado(dl, 'Razão social', e.razao_social);
    linhaDado(dl, 'CNPJ', e.cnpj_formatado + (e.matriz ? ' (matriz)' : ' (filial)'));
    linhaDado(dl, 'UF', e.uf);
    linhaDado(dl, 'Situação cadastral', e.situacao_cadastral + (e.ativa ? '' : ' — atenção: empresa não está ativa'),
              e.ativa ? '' : 'erro');
    if (r.matriz) linhaDado(dl, 'Matriz', r.matriz.cnpj_formatado + ' — ' + r.matriz.uf);
    dadosEmpresa.replaceChildren(dl);
    escolhas.replaceChildren();

    const avisos = [];
    if (e.matriz) {
      if (e.atendida) botaoEscolha('Emitir certidões', e);
      else avisos.push('Empresa com CNPJ de ' + e.uf + ': não atendida nesta versão, que cobre apenas CNPJ de SP.');
    } else {
      avisos.push('Este CNPJ é de filial. Escolha qual CNPJ consultar.');
      botaoEscolha('Consultar a filial ' + e.cnpj_formatado + (e.atendida ? '' : ' (fora de SP)'), e);
      if (r.matriz) {
        botaoEscolha('Consultar a matriz ' + r.matriz.cnpj_formatado + (r.matriz.atendida ? '' : ' (fora de SP)'), r.matriz);
        if (!r.matriz.atendida) avisos.push('A matriz é de ' + r.matriz.uf + ': não atendida nesta versão.');
      }
      if (r.erro_matriz) avisos.push(r.erro_matriz);
      if (!e.atendida) avisos.push('A filial é de ' + e.uf + ': não atendida nesta versão.');
    }
    avisoEmpresa.textContent = avisos.join(' ');
    avisoEmpresa.className = avisos.length ? 'alerta' : '';
    cartao.hidden = false;
  }

  async function iniciar(cnpj) {
    travar(true);
    try {
      const r = await window.pywebview.api.emitir(cnpj);
      if (!r.ok) {
        mostrar(r.mensagem, true);
        travar(false);
        return;
      }
      corpo.replaceChildren();
      linhas.clear();
      avisoFilial.textContent = r.aviso || '';
      avisoFilial.hidden = !r.aviso;
      mostrar('Consultando o CNPJ ' + r.cnpj + '...');
      acompanhar();
    } catch (erro) {
      mostrar('Erro inesperado: ' + erro, true);
      travar(false);
    }
  }

  document.getElementById('formulario').addEventListener('submit', async (evento) => {
    evento.preventDefault();
    travar(true);
    cartao.hidden = true;
    avisoFilial.hidden = true;
    mostrar('Identificando a empresa...');
    try {
      const r = await window.pywebview.api.identificar(document.getElementById('cnpj').value);
      if (r.ok) {
        mostrar('');
        mostrarEmpresa(r);
      } else {
        mostrar(r.mensagem, true);
      }
    } catch (erro) {
      mostrar('Erro inesperado: ' + erro, true);
    }
    travar(false);
  });
</script>
</body>
</html>
