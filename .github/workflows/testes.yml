name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Rodar os testes (portal falso local, sem acesso aos portais reais)
        run: python -m pytest -q
